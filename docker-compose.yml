# IRIS Data Copilot - full stack: IRIS (data + AI Hub) + web portal.
# Settings come from .env (copy .env.example). See README.md.
services:
  iris:
    build:
      context: .
      dockerfile: iris/Dockerfile
      args:
        IMAGE: ${IRIS_IMAGE:-docker.iscinternal.com/docker-intersystems/intersystems/irishealth-community:2026.3.0AI.136.0}
        COPILOT_DEMO: ${COPILOT_DEMO:-1}
    image: iris-data-copilot-iris:latest
    container_name: copilot-iris
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_AGENT_MODEL=${LLM_AGENT_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COPILOT_LANG=${COPILOT_LANG:-en}
      - PRIVACY_MODE=${PRIVACY_MODE:-0}
      - PRIVACY_MIN_ROWS=${PRIVACY_MIN_ROWS:-10}
      - VIEW_SCHEMA=${VIEW_SCHEMA:-Analytics}
      - VISIBLE_SCHEMAS=${VISIBLE_SCHEMAS:-}
      - HIDDEN_SCHEMAS=${HIDDEN_SCHEMAS:-}
      - MAX_ROWS=${MAX_ROWS:-1000}
      - SIMULATOR_INTERVAL=${SIMULATOR_INTERVAL:-5}
    volumes:
      - ./keys:/external/keys:ro
    ports:
      - "${IRIS_PORT:-1972}:1972"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/1972"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s

  web:
    build:
      context: web
    image: iris-data-copilot-web:latest
    container_name: copilot-web
    environment:
      - IRIS_HOST=iris
      - IRIS_PORT=1972
      - IRIS_NAMESPACE=${IRIS_NAMESPACE:-COPILOT}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      iris:
        condition: service_healthy

  # InterSystems Web Gateway: serves the IRIS Management Portal (production configuration,
  # BPL diagrams, Visual Trace) - the AI Hub images ship without a web server.
  #   http://localhost:52773/csp/sys/UtilHome.csp
  webgateway:
    image: ${WEBGATEWAY_IMAGE:-containers.intersystems.com/intersystems/webgateway:2026.1}
    container_name: copilot-webgateway
    environment:
      - ISC_CSP_CONF_FILE=/webgateway-shared/CSP.conf
      - ISC_CSP_INI_FILE=/webgateway-shared/CSP.ini
    volumes:
      - ./webgateway:/webgateway-shared
    ports:
      - "${IRIS_WEB_PORT:-52773}:80"
    depends_on:
      iris:
        condition: service_healthy
